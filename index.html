<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speed Reader</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0b14;
  --surface: #161625;
  --surface2: #22223a;
  --primary: #ff6b6b;
  --primary-glow: rgba(255, 107, 107, 0.25);
  --text: #eee;
  --text-dim: #555;
  --radius: 14px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  width: 100%;
  max-width: 780px;
  padding: 24px;
}

/* Header */
header {
  text-align: center;
  margin-bottom: 36px;
}

header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--primary) 0%, #ffa07a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

header p {
  color: var(--text-dim);
  margin-top: 4px;
  font-size: 0.9rem;
}

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Input Screen */
#input-screen .card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 32px;
  border: 1px solid rgba(255,255,255,0.05);
}

.input-group { margin-bottom: 18px; }

.input-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.url-row {
  display: flex;
  gap: 8px;
}
.url-row input { flex: 1; }

input[type="url"], textarea {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--surface2);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s;
}

input[type="url"]:focus, textarea:focus {
  border-color: var(--primary);
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 20px 0;
  color: var(--text-dim);
  font-size: 0.8rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--surface2);
}

.controls-row {
  display: flex;
  gap: 24px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.controls-row > * { flex: 1; min-width: 140px; }

.controls-row label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.speed-value { color: var(--primary); font-weight: 700; }

/* Range slider */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--surface2);
  border-radius: 4px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: var(--primary);
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}
input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: var(--primary);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--surface2);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  cursor: pointer;
}
select:focus { border-color: var(--primary); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface2);
  color: var(--text);
  white-space: nowrap;
}
.btn:hover { background: #33335a; }
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--primary);
  color: #fff;
  width: 100%;
  padding: 14px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 10px;
}
.btn-primary:hover {
  background: #ff5252;
  box-shadow: 0 4px 20px var(--primary-glow);
}

.btn-small {
  padding: 6px 14px;
  font-size: 0.8rem;
}

.msg {
  font-size: 0.82rem;
  margin-top: 6px;
  min-height: 1.2em;
}
.msg.error { color: var(--primary); }
.msg.success { color: #4ade80; }
.msg.loading { color: var(--text-dim); }

/* Reader Screen */
#reader-screen {
  display: flex;
  flex-direction: column;
  height: 88vh;
  min-height: 520px;
}

.reader-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--surface2);
  margin-bottom: 8px;
  gap: 12px;
}

.reader-title {
  font-size: 0.85rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.reader-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.8rem;
  color: var(--text-dim);
  flex-shrink: 0;
}
.reader-stats .stat { color: var(--text); font-weight: 600; }

/* Reader Display Area */
#reader-display {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 200px;
}

/* Context mode */
.context-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-wrap: nowrap;
  line-height: 1.4;
  padding: 8px 0;
  transition: opacity 0.12s ease;
}

.context-line .word {
  display: inline-block;
  transition: all 0.12s ease;
  padding: 2px 3px;
  border-radius: 4px;
  white-space: nowrap;
}

.context-line .word.active-word {
  opacity: 1;
  color: #fff;
  font-weight: 700;
  background: var(--primary);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 1.15em;
  box-shadow: 0 0 24px var(--primary-glow);
}

.context-line .word.near {
  opacity: 0.4;
  font-size: 0.82em;
}

.context-line .word.far {
  opacity: 0.15;
  font-size: 0.68em;
}

/* Spritz mode */
.spritz-display {
  font-size: 3.8rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  line-height: 1.2;
}

.spritz-display .anchor-letter {
  color: var(--primary);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-color: var(--primary);
  text-underline-offset: 4px;
}

/* Finished state */
.reader-finished {
  text-align: center;
  opacity: 0.5;
}
.reader-finished .big {
  font-size: 3rem;
  margin-bottom: 8px;
}
.reader-finished .sub {
  font-size: 1rem;
  color: var(--text-dim);
}

/* Progress bar */
.progress-container {
  width: 100%;
  height: 3px;
  background: var(--surface2);
  border-radius: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #ffa07a);
  border-radius: 4px;
  transition: width 0.15s ease;
  width: 0%;
}

/* Reader controls */
.reader-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ctrl-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.1rem;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.15s;
  line-height: 1;
}
.ctrl-btn:hover {
  color: var(--text);
  background: var(--surface2);
}
.ctrl-btn:active { transform: scale(0.92); }

.ctrl-btn.play-btn {
  font-size: 1.6rem;
  background: var(--primary);
  color: #fff;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.ctrl-btn.play-btn:hover {
  background: #ff5252;
  box-shadow: 0 0 20px var(--primary-glow);
}

.wpm-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 8px;
}
.wpm-group input[type="range"] {
  width: 90px;
}
.wpm-group .label {
  font-size: 0.78rem;
  color: var(--text-dim);
  min-width: 36px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Shortcuts hint */
.shortcuts-hint {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 12px;
  opacity: 0.35;
  user-select: none;
}

/* Loading overlay */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(6px);
}
.loading-overlay.show { display: flex; }

.loading-box {
  background: var(--surface);
  padding: 36px 52px;
  border-radius: var(--radius);
  text-align: center;
  border: 1px solid var(--surface2);
}

.spinner {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 3px solid var(--surface2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 600px) {
  #app { padding: 12px; }
  #input-screen .card { padding: 20px; }
  .context-line { gap: 2px; }
  .context-line .word.active-word { font-size: 1em; padding: 3px 7px; }
  .spritz-display { font-size: 2.4rem; }
  .controls-row { flex-direction: column; gap: 12px; }
  .reader-controls { gap: 4px; }
  .ctrl-btn.play-btn { width: 44px; height: 44px; font-size: 1.3rem; }
  .wpm-group input[type="range"] { width: 60px; }
  #reader-screen { height: 85vh; min-height: 400px; }
  .reader-stats { gap: 8px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Speed Reader</h1>
    <p>Read faster with guided word-highlighting</p>
  </header>

  <!-- ======== INPUT SCREEN ======== -->
  <div id="input-screen" class="screen active">
    <div class="card">
      <div class="input-group">
        <label for="url-input">Article URL</label>
        <div class="url-row">
          <input type="url" id="url-input" placeholder="https://example.com/article" autocomplete="url" />
          <button class="btn" id="fetch-btn">Fetch</button>
        </div>
      </div>

      <div class="divider">or paste text directly</div>

      <div class="input-group">
        <label for="text-input">Text</label>
        <textarea id="text-input" placeholder="Paste the article text here, then click Start Reading..."></textarea>
        <div id="status-msg" class="msg"></div>
      </div>

      <div class="controls-row">
        <div>
          <label>Speed: <span class="speed-value" id="wpm-display">300</span> WPM</label>
          <input type="range" id="wpm-slider" min="60" max="900" value="300" step="5" />
        </div>
        <div>
          <label>Mode</label>
          <select id="mode-select">
            <option value="context">Context (5 words)</option>
            <option value="spritz">Spritz (1 word)</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="start-btn">Start Reading</button>

      <div style="text-align:center; margin-top:12px;">
        <button class="btn btn-small" id="demo-btn">Load Demo Text</button>
      </div>
    </div>
  </div>

  <!-- ======== READER SCREEN ======== -->
  <div id="reader-screen" class="screen">
    <div class="reader-header">
      <div class="reader-title" id="article-title">Article</div>
      <div class="reader-stats">
        <span><span class="stat" id="current-word">0</span> / <span id="total-words">0</span></span>
        <span id="time-estimate">—</span>
        <button class="btn btn-small" id="close-btn" title="Exit (Esc)">✕</button>
      </div>
    </div>

    <div id="reader-display">
      <div style="color:var(--text-dim);text-align:center;font-size:1.2rem;opacity:0.5;">
        Press ▶ to start reading
      </div>
    </div>

    <div class="reader-footer">
      <div class="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="reader-controls">
        <button class="ctrl-btn" id="rewind-btn" title="Back 10 words (↑)">⏪</button>
        <button class="ctrl-btn" id="back-btn" title="Back 1 word">◀</button>
        <button class="ctrl-btn play-btn" id="play-btn" title="Play/Pause (Space)">▶</button>
        <button class="ctrl-btn" id="fwd-btn" title="Forward 1 word">▶</button>
        <button class="ctrl-btn" id="forward-btn" title="Forward 10 words (↓)">⏩</button>

        <div class="wpm-group">
          <input type="range" id="reader-wpm" min="60" max="900" value="300" step="5" title="Speed (← →)" />
          <span class="label" id="reader-wpm-display">300</span>
        </div>
      </div>

      <div class="shortcuts-hint">
        Space: Play/Pause &nbsp;·&nbsp; ← → : Speed &nbsp;·&nbsp; ↑ ↓ : Skip &nbsp;·&nbsp; Esc: Exit
      </div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p>Fetching article…</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  DOM refs
  // ============================================================
  const $ = (id) => document.getElementById(id);

  const dom = {
    inputScreen:   $('input-screen'),
    readerScreen:  $('reader-screen'),
    urlInput:      $('url-input'),
    textInput:     $('text-input'),
    fetchBtn:      $('fetch-btn'),
    statusMsg:     $('status-msg'),
    startBtn:      $('start-btn'),
    demoBtn:       $('demo-btn'),
    wpmSlider:     $('wpm-slider'),
    wpmDisplay:    $('wpm-display'),
    modeSelect:    $('mode-select'),

    articleTitle:    $('article-title'),
    currentWordSpan: $('current-word'),
    totalWordsSpan:  $('total-words'),
    timeEstimate:    $('time-estimate'),
    progressFill:    $('progress-fill'),
    playBtn:         $('play-btn'),
    rewindBtn:       $('rewind-btn'),
    backBtn:         $('back-btn'),
    fwdBtn:          $('fwd-btn'),
    forwardBtn:      $('forward-btn'),
    closeBtn:        $('close-btn'),
    readerWpm:       $('reader-wpm'),
    readerWpmDisplay:$('reader-wpm-display'),
    readerDisplay:   $('reader-display'),
    loadingOverlay:  $('loading-overlay'),
  };

  // ============================================================
  //  State
  // ============================================================
  let words         = [];
  let currentIndex  = 0;
  let isPlaying     = false;
  let wpm           = 300;
  let mode          = 'context';  // 'context' | 'spritz'
  let timer         = null;
  let articleTitle  = '';

  const MIN_WPM = 60;
  const MAX_WPM = 900;
  const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

  // ============================================================
  //  Utilities
  // ============================================================
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function getAnchorIndex(word) {
    const clean = word.replace(/[^a-zA-Z0-9]/g, '');
    const len = clean.length;
    if (len <= 1) return 0;
    if (len <= 4) return 1;
    if (len <= 7) return Math.floor(len * 0.32);
    if (len <= 11) return Math.floor(len * 0.3);
    return Math.floor(len * 0.28);
  }

  /** Split text into word tokens, preserving punctuation. */
  function tokenize(text) {
    const tokens = text.match(/\S+/g);
    return tokens || [];
  }

  // ============================================================
  //  Fetch URL
  // ============================================================
  async function fetchURL() {
    let url = dom.urlInput.value.trim();
    if (!url) return;

    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
      dom.urlInput.value = url;
    }

    setStatus('', '');
    showLoading(true);

    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`Server returned ${res.status}`);

      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      // Extract title
      const title = doc.querySelector('title');
      articleTitle = title ? title.textContent.trim() : 'Untitled';

      // Extract article text
      let text = extractArticleText(doc);

      if (!text || text.split(/\s+/).length < 8) {
        // Fallback to body
        const body = doc.body;
        if (body) {
          text = body.textContent.replace(/\s+/g, ' ').trim();
          // Remove common junk
          text = text.replace(/(cookie|privacy|subscribe|sign up|newsletter)[^.]*\./gi, '').trim();
        }
      }

      if (!text || text.length < 30) {
        throw new Error('Could not extract article text. Try pasting directly.');
      }

      dom.textInput.value = text;
      const wc = text.split(/\s+/).length;
      setStatus(`✓ Loaded "${articleTitle}" (${wc} words)`, 'success');

    } catch (err) {
      setStatus(`✗ ${err.message}`, 'error');
    } finally {
      showLoading(false);
    }
  }

  function extractArticleText(doc) {
    const candidates = [
      'article',
      '[role="main"]',
      '.post-content', '.article-content', '.entry-content',
      '.story-body', '.article-body',
      '.content', '#content',
      'main',
    ];
    for (const sel of candidates) {
      const el = doc.querySelector(sel);
      if (el) {
        const clone = el.cloneNode(true);
        clone.querySelectorAll('script,style,nav,footer,.ad,.ads,.advertisement,.social-share,.sidebar,.related')
          .forEach(n => n.remove());
        const text = clone.textContent.replace(/\s+/g, ' ').trim();
        if (text.length > 50) return text;
      }
    }
    return null;
  }

  // ============================================================
  //  Start / Demo / Exit
  // ============================================================
  function startReading() {
    const text = dom.textInput.value.trim();
    if (!text) {
      setStatus('Please paste some text or fetch a URL above.', 'error');
      return;
    }

    const tokens = tokenize(text);
    if (tokens.length < 5) {
      setStatus('Please enter more text (at least a few words).', 'error');
      return;
    }

    words = tokens;
    currentIndex = 0;
    isPlaying = false;
    wpm = parseInt(dom.wpmSlider.value);
    mode = dom.modeSelect.value;

    // Sync reader WPM
    dom.readerWpm.value = wpm;
    dom.readerWpmDisplay.textContent = wpm;

    // Title
    dom.articleTitle.textContent = articleTitle || 'Article';
    dom.totalWordsSpan.textContent = words.length;

    // Switch view
    dom.inputScreen.classList.remove('active');
    dom.readerScreen.classList.add('active');

    // Render initial state
    render();
    updateProgress();
    updateEstimate();

    // Auto-play
    play();
  }

  function loadDemo() {
    articleTitle = 'How Speed Reading Works';

    dom.textInput.value =
    `Speed reading is any of several techniques used to improve your ability to read quickly. The most common methods include chunking, minimizing subvocalization, and using visual aids to guide the eyes.

    Recent studies show that the average adult reads at about 200 to 300 words per minute. With speed reading techniques, many people can double that rate while maintaining solid comprehension.

    One effective method is Rapid Serial Visual Presentation, or RSVP. This technique displays words one at a time at a fixed location on screen. By removing the need for eye movements, your brain can focus purely on processing meaning.

    Why does this work? When you read normally, your eyes make rapid movements called saccades, followed by brief pauses called fixations. These saccades take time and energy. With RSVP, every word appears in the same spot, so your eyes never need to move.

    Research suggests that most readers can comfortably process text at 300 to 500 words per minute with this method. With regular practice, some people reach speeds of 600 to 800 words per minute while maintaining good comprehension.

    The key is to relax and let your brain do what it does best: recognize words. You do not need to consciously sound out each word. Your visual system can recognize familiar words instantly.

    Try different speeds to find your sweet spot. Start at 300 WPM and gradually increase. If you feel lost, slow down. The goal is not maximum speed but comfortable, efficient reading.

    Happy reading!`;

    dom.urlInput.value = '';
    setStatus('✓ Demo text loaded. Click Start Reading to begin.', 'success');
  }

  function exitReader() {
    pause();
    currentIndex = 0;
    dom.readerScreen.classList.remove('active');
    dom.inputScreen.classList.add('active');
    dom.progressFill.style.width = '0%';
    dom.currentWordSpan.textContent = '0';
    articleTitle = '';
  }

  // ============================================================
  //  Render
  // ============================================================
  function render() {
    if (!words.length) return;

    if (currentIndex >= words.length) {
      dom.readerDisplay.innerHTML =
        `<div class="reader-finished">
          <div class="big">📖</div>
          <div class="sub">Finished — ${words.length} words read</div>
        </div>`;
      return;
    }

    dom.readerDisplay.innerHTML = mode === 'spritz' ? renderSpritz() : renderContext();
  }

  function renderContext() {
    const W = 5;                // window size (odd)
    const half = Math.floor(W / 2);
    const start = Math.max(0, currentIndex - half);
    const end = Math.min(words.length, currentIndex + half + 1);

    const padLeft  = Math.max(0, half - currentIndex);
    const padRight = Math.max(0, (currentIndex + half + 1) - words.length);

    let html = '<div class="context-line">';

    // padding
    for (let i = 0; i < padLeft; i++) html += '<span class="word" style="opacity:0;pointer-events:none">·</span>';

    for (let i = start; i < end; i++) {
      if (i === currentIndex) {
        html += `<span class="word active-word">${escapeHtml(words[i])}</span>`;
      } else {
        const dist = Math.abs(i - currentIndex);
        const cls = dist === 1 ? 'near' : 'far';
        html += `<span class="word ${cls}">${escapeHtml(words[i])}</span>`;
      }
    }

    for (let i = 0; i < padRight; i++) html += '<span class="word" style="opacity:0;pointer-events:none">·</span>';

    html += '</div>';
    return html;
  }

  function renderSpritz() {
    const word = words[currentIndex];
    if (!word) return '<div class="spritz-display">—</div>';

    const anchorIdx = getAnchorIndex(word);
    const before = word.slice(0, anchorIdx);
    const anchor = word[anchorIdx] || '';
    const after  = word.slice(anchorIdx + 1);

    // Handle very short words where anchor might be at the end
    if (!anchor) {
      return `<div class="spritz-display">${escapeHtml(word)}</div>`;
    }

    return `<div class="spritz-display">
      <span>${escapeHtml(before)}</span>
      <span class="anchor-letter">${escapeHtml(anchor)}</span>
      <span>${escapeHtml(after)}</span>
    </div>`;
  }

  // ============================================================
  //  Playback
  // ============================================================
  function play() {
    if (isPlaying || currentIndex >= words.length) return;
    isPlaying = true;
    dom.playBtn.textContent = '⏸';
    scheduleNext();
  }

  function pause() {
    isPlaying = false;
    dom.playBtn.textContent = '▶';
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function togglePlay() {
    isPlaying ? pause() : play();
  }

  function scheduleNext() {
    if (!isPlaying || currentIndex >= words.length) return;

    let ms = 60000 / wpm;

    // Punctuation pauses
    const word = words[currentIndex];
    if (/[.!?]$/.test(word))      ms *= 1.8;
    else if (/[,;:]$/.test(word)) ms *= 1.35;
    else if (/[)—\u2014]$/.test(word)) ms *= 1.25;

    timer = setTimeout(() => {
      if (!isPlaying) return;

      currentIndex++;

      if (currentIndex >= words.length) {
        pause();
        render();
        updateProgress();
        dom.playBtn.textContent = '▶';
        dom.articleTitle.textContent = '📖 Finished!';
        return;
      }

      render();
      updateProgress();
      updateEstimate();
      scheduleNext();
    }, ms);
  }

  function restartTimer() {
    if (isPlaying) {
      if (timer) clearTimeout(timer);
      scheduleNext();
    }
  }

  function goForward(n) {
    if (!words.length) return;
    currentIndex = Math.min(currentIndex + n, words.length - 1);
    render();
    updateProgress();
    updateEstimate();
    restartTimer();
  }

  function goBack(n) {
    if (!words.length) return;
    currentIndex = Math.max(currentIndex - n, 0);
    render();
    updateProgress();
    updateEstimate();
    restartTimer();
  }

  function adjustSpeed(delta) {
    const newVal = Math.max(MIN_WPM, Math.min(MAX_WPM, wpm + delta));
    wpm = newVal;
    dom.wpmSlider.value = newVal;
    dom.wpmDisplay.textContent = newVal;
    dom.readerWpm.value = newVal;
    dom.readerWpmDisplay.textContent = newVal;
    restartTimer();
  }

  // ============================================================
  //  UI updates
  // ============================================================
  function updateProgress() {
    const total = words.length;
    const cur = Math.min(currentIndex + 1, total);
    const pct = total > 0 ? (cur / total) * 100 : 0;
    dom.progressFill.style.width = pct + '%';
    dom.currentWordSpan.textContent = cur;
  }

  function updateEstimate() {
    const remaining = words.length - currentIndex;
    const mins = remaining / wpm;
    dom.timeEstimate.textContent = mins < 1 ? '<1 min' : `${Math.ceil(mins)} min`;
  }

  function setStatus(msg, type) {
    dom.statusMsg.textContent = msg;
    dom.statusMsg.className = 'msg' + (type ? ' ' + type : '');
  }

  function showLoading(show) {
    dom.loadingOverlay.classList.toggle('show', show);
  }

  // ============================================================
  //  Event binding
  // ============================================================
  function init() {
    // URL fetch
    dom.fetchBtn.addEventListener('click', fetchURL);
    dom.urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchURL(); });

    // Start / Demo
    dom.startBtn.addEventListener('click', startReading);
    dom.demoBtn.addEventListener('click', loadDemo);

    // Exit reader
    dom.closeBtn.addEventListener('click', exitReader);

    // Playback controls
    dom.playBtn.addEventListener('click', togglePlay);
    dom.rewindBtn.addEventListener('click', () => goBack(10));
    dom.backBtn.addEventListener('click', () => goBack(1));
    dom.fwdBtn.addEventListener('click', () => goForward(1));
    dom.forwardBtn.addEventListener('click', () => goForward(10));

    // WPM slider sync
    function syncWPM(src, dst) {
      wpm = parseInt(src.value);
      dst.textContent = wpm;
      dom.wpmSlider.value = wpm;
      dom.wpmDisplay.textContent = wpm;
      dom.readerWpm.value = wpm;
      dom.readerWpmDisplay.textContent = wpm;
      restartTimer();
    }

    dom.wpmSlider.addEventListener('input', function () {
      syncWPM(this, dom.wpmDisplay);
    });
    dom.readerWpm.addEventListener('input', function () {
      syncWPM(this, dom.readerWpmDisplay);
    });

    // Mode switch
    dom.modeSelect.addEventListener('change', () => {
      mode = dom.modeSelect.value;
      if (words.length) render();
    });

    // Keyboard shortcuts (only in reader view)
    document.addEventListener('keydown', (e) => {
      if (!dom.readerScreen.classList.contains('active')) return;

      switch (e.key) {
        case ' ':        e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft':  e.preventDefault(); adjustSpeed(-10); break;
        case 'ArrowRight': e.preventDefault(); adjustSpeed(10); break;
        case 'ArrowUp':    e.preventDefault(); goBack(5); break;
        case 'ArrowDown':  e.preventDefault(); goForward(5); break;
        case 'Escape':     e.preventDefault(); exitReader(); break;
      }
    });
  }

  // Boot
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
